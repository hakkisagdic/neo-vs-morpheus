name: ci

# The bot's type check and tests on every push and pull request; a syntax check of the Python scripts
# that train and run the fleet (they need GPUs, Kaggle or the arena to run for real), and their tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m py_compile lab/*.py training/*.py
      # The lab's own tests (the gate's statistics, the agent tools): standard library, no game, no network.
      - run: python -m unittest discover -s lab -p "test_*.py"
