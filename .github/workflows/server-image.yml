name: server image

# The world and arena server (ModernUO at deps.lock's commit with the NeoArena overlay and the opt-in
# SosariaAI plugin, as server/Dockerfile builds it) as a container image on GHCR, so that a machine
# with Docker pulls it instead of building it for half an hour: amd64 for the Linux hosts, arm64 for
# Apple Silicon. The tag names ModernUO's commit and the overlay's content (with the plugin's pin):
# <modernuo>-<overlay>, plus latest (scripts/server-image.sh pull computes the same tag). EA's client
# files are never in it.
on:
  push:
    branches: [main]
    paths: [server/Dockerfile, server/entrypoint.sh, "server/overlay/**", deps.lock, scripts/server-image.sh, .github/workflows/server-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/laya-modernuo

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deps.sh sync
      - id: tag
        run: echo "tag=$(scripts/server-image.sh tag)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          build-contexts: |
            modernuo=vendor/modernuo
            sosariaai=vendor/sosariaai
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ModernUO with the NeoArena overlay and the opt-in SosariaAI plugin, for the Laya UO bot's arena and world servers
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          t=${{ needs.build.outputs.tag }}
          docker buildx imagetools create -t "$IMAGE:$t" -t "$IMAGE:latest" "$IMAGE:$t-amd64" "$IMAGE:$t-arm64"
